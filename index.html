<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Piyush Kumar | Portfolio</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* Global */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Montserrat', sans-serif;
    }

    body, html {
      height: 100%;
      scroll-behavior: smooth;
    }

    
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 120%;
      height: 120%;
      background: url('https://images.unsplash.com/photo-1506765515384-028b60a970df?auto=format&fit=crop&w=1400&q=80') no-repeat center center/cover;
      opacity: 0.2;
      transform: scale(1.1);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 800px;
      animation: fadeIn 2s ease-in-out;
    }

    .hero-content h1 {
      font-size: 3rem;
      margin-bottom: 15px;
    }

    .hero-content p {
      font-size: 1.2rem;
      margin-bottom: 30px;
      color: #f0f0f0;
    }

    .hero-content a {
      text-decoration: none;
      padding: 15px 35px;
      background: #ffffff;
      color: #203a43;
      font-weight: 700;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .hero-content a:hover {
      background: #2c5364;
      color: white;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(50px); }
      to { opacity: 1; transform: translateY(0); }
    }

    
    .shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      animation: float 8s infinite ease-in-out;
    }

    .shape1 { width: 100px; height: 100px; top: 20%; left: 10%; animation-delay: 0s; }
    .shape2 { width: 60px; height: 60px; top: 60%; left: 80%; animation-delay: 2s; }
    .shape3 { width: 150px; height: 150px; top: 40%; left: 50%; animation-delay: 4s; }

    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-20px) translateX(20px); }
    }

    @media(max-width: 768px){
      .hero-content h1 { font-size: 2rem; }
      .hero-content p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="hero">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <div class="hero-content">
      <h1>Hi, I'm Piyush Kumar</h1>
      <p>Aspiring Software Developer | AI Enthusiast | Tech Innovator</p>
      <a href="portfolio.html">Explore My Portfolio</a>
    </div>
  </div>
</body>
</html>
